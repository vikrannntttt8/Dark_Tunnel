name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Run unit & protocol tests
      run: go test -v -race ./...

    - name: Build client/server CLI
      run: go build -v ./cmd/tunnel
